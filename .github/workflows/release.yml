name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Display version used for dry-run packaging"
        required: false
        default: "0.1.0-dev"

permissions:
  contents: write

jobs:
  build-windows-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Initialize MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Resolve version metadata
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "push") {
            $displayVersion = "${{ github.ref_name }}" -replace '^v', ''
          } else {
            $displayVersion = "${{ inputs.version }}"
          }

          if ([string]::IsNullOrWhiteSpace($displayVersion)) {
            throw "Display version is required."
          }

          $match = [regex]::Match($displayVersion, '^(?<numeric>\d+\.\d+\.\d+)')
          if (-not $match.Success) {
            throw "Display version '$displayVersion' must start with a numeric x.y.z prefix."
          }

          $numericVersion = $match.Groups["numeric"].Value
          $packageBaseName = "NetworkSpeaker-$displayVersion-win-x64"

          "display_version=$displayVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "numeric_version=$numericVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "package_base_name=$packageBaseName" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Run launcher core tests
        shell: pwsh
        run: |
          dotnet test .\apps\windows-launcher\NetworkSpeaker.Launcher.Core.Tests\NetworkSpeaker.Launcher.Core.Tests.csproj --configuration Release

      - name: Package Windows installer
        shell: pwsh
        run: |
          .\tools\package-windows-installer.ps1 `
            -Version "${{ steps.version.outputs.display_version }}" `
            -PackageBaseName "${{ steps.version.outputs.package_base_name }}"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            artifacts/release/*.msi
            artifacts/release/*.sha256.txt

      - name: Generate release notes
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $template = Get-Content .github\release-notes-template.md -Raw
          $notes = $template.Replace("{{VERSION}}", "${{ steps.version.outputs.display_version }}")
          $notes = $notes.Replace("{{PACKAGE_BASENAME}}", "${{ steps.version.outputs.package_base_name }}")
          Set-Content -LiteralPath release-notes.md -Value $notes -Encoding utf8

      - name: Publish GitHub release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            artifacts/release/*.msi
            artifacts/release/*.sha256.txt
            ${{ github.workspace }}/client/android-app/app/build/outputs/apk/release/*.apk

  build-android-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: |
          sdkmanager --install "ndk;27.1.12297006" "cmake;3.22.1"

      - name: Grant execute permission for gradlew
        working-directory: client/android-app
        run: chmod +x gradlew

      - name: Build release APK
        working-directory: client/android-app
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Find APK
        id: find_apk
        run: |
          APK_PATH=$(find . -name "*.apk" -path "*/release/*" | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "No APK found!"
            find . -name "*.apk" 2>/dev/null || echo "No APK files found"
            exit 1
          fi
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "Found APK at: $APK_PATH"

      - name: Rename APK with version
        run: |
          VERSION="${{ github.event_name == 'push' && github.ref_name || inputs.version }}"
          cp "${{ steps.find_apk.outputs.apk_path }}" \
             "NetworkSpeaker-${VERSION}-android-arm64.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: NetworkSpeaker-*-android-arm64.apk

      - name: Attach APK to release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: NetworkSpeaker-*-android-arm64.apk

  build-linux-hostd:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            label: ubuntu2204
          - os: ubuntu-24.04
            label: ubuntu2404
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build pkg-config \
            libopus-dev libpulse-dev libgtest-dev

      - name: Install modern CMake
        run: |
          pip install cmake 2>/dev/null || PIP_BREAK_SYSTEM_PACKAGES=1 pip install cmake
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            DISPLAY_VERSION="${{ github.ref_name }}"
            DISPLAY_VERSION="${DISPLAY_VERSION#v}"
          else
            DISPLAY_VERSION="${{ inputs.version }}"
          fi
          echo "display_version=$DISPLAY_VERSION" >> "$GITHUB_OUTPUT"

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package
        run: |
          VERSION="${{ steps.version.outputs.display_version }}"
          ARCHIVE_DIR="NetworkSpeaker-${VERSION}-linux-amd64-${{ matrix.label }}"
          mkdir "$ARCHIVE_DIR"
          cp build/hostd "$ARCHIVE_DIR/"
          tar -czf "${ARCHIVE_DIR}.tar.gz" "$ARCHIVE_DIR"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-hostd-${{ matrix.label }}
          path: NetworkSpeaker-*-linux-amd64-${{ matrix.label }}.tar.gz

      - name: Attach to release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: NetworkSpeaker-*-linux-amd64-${{ matrix.label }}.tar.gz

  build-desktop-linux:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build pkg-config \
            libopus-dev libpulse-dev libgtest-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install modern CMake
        run: |
          pip install cmake 2>/dev/null || PIP_BREAK_SYSTEM_PACKAGES=1 pip install cmake
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            DISPLAY_VERSION="${{ github.ref_name }}"
            DISPLAY_VERSION="${DISPLAY_VERSION#v}"
          else
            DISPLAY_VERSION="${{ inputs.version }}"
          fi
          echo "display_version=$DISPLAY_VERSION" >> "$GITHUB_OUTPUT"

      - name: Build hostd
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build build --target hostd

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build Tauri app
        working-directory: apps/desktop
        run: npx tauri build

      - name: Package desktop app
        run: |
          VERSION="${{ steps.version.outputs.display_version }}"
          ARCHIVE_DIR="NetworkSpeaker-Desktop-${VERSION}-linux-amd64"
          mkdir "$ARCHIVE_DIR"
          # Copy Tauri bundle outputs
          cp apps/desktop/src-tauri/target/release/network-speaker-desktop "$ARCHIVE_DIR/"
          cp build/hostd "$ARCHIVE_DIR/"
          # Include deb if built
          find apps/desktop/src-tauri/target/release/bundle/deb -name '*.deb' -exec cp {} . \; 2>/dev/null || true
          find apps/desktop/src-tauri/target/release/bundle/appimage -name '*.AppImage' -exec cp {} . \; 2>/dev/null || true
          tar -czf "${ARCHIVE_DIR}.tar.gz" "$ARCHIVE_DIR"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: |
            NetworkSpeaker-Desktop-*-linux-amd64.tar.gz
            *.deb
            *.AppImage

      - name: Attach to release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: |
            NetworkSpeaker-Desktop-*-linux-amd64.tar.gz
            *.deb
            *.AppImage

  build-desktop-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "push") {
            $displayVersion = "${{ github.ref_name }}" -replace '^v', ''
          } else {
            $displayVersion = "${{ inputs.version }}"
          }
          "display_version=$displayVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build hostd
        shell: pwsh
        run: |
          cmake --preset windows-ninja-vcpkg
          cmake --build --preset windows-ninja-vcpkg --target hostd

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build Tauri app
        working-directory: apps/desktop
        run: npx tauri build

      - name: Package desktop app
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.display_version }}"
          $archiveDir = "NetworkSpeaker-Desktop-$version-win-x64"
          New-Item -ItemType Directory -Force -Path $archiveDir | Out-Null
          Copy-Item "apps\desktop\src-tauri\target\release\network-speaker-desktop.exe" "$archiveDir\"
          Copy-Item "out\build\windows-ninja-vcpkg\hostd.exe" "$archiveDir\"
          # Include MSI installer if built by Tauri
          Get-ChildItem -Recurse -Path "apps\desktop\src-tauri\target\release\bundle\msi" -Filter "*.msi" |
            Copy-Item -Destination . -ErrorAction SilentlyContinue
          Get-ChildItem -Recurse -Path "apps\desktop\src-tauri\target\release\bundle\nsis" -Filter "*.exe" |
            Copy-Item -Destination . -ErrorAction SilentlyContinue
          Compress-Archive -Path "$archiveDir\*" -DestinationPath "$archiveDir.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: |
            NetworkSpeaker-Desktop-*-win-x64.zip
            *.msi
            *.exe

      - name: Attach to release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: |
            NetworkSpeaker-Desktop-*-win-x64.zip
            *.msi

  build-linux-rpm:
    runs-on: ubuntu-latest
    container: fedora:latest

    steps:
      - name: Install system dependencies
        run: |
          dnf install -y git gcc-c++ ninja-build pkgconf \
            opus-devel pulseaudio-libs-devel gtest-devel \
            python3-pip rpm-build

      - name: Install modern CMake
        run: PIP_BREAK_SYSTEM_PACKAGES=1 pip install cmake

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            DISPLAY_VERSION="${{ github.ref_name }}"
            DISPLAY_VERSION="${DISPLAY_VERSION#v}"
          else
            DISPLAY_VERSION="${{ inputs.version }}"
          fi
          echo "display_version=$DISPLAY_VERSION" >> "$GITHUB_OUTPUT"

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Build RPM
        run: |
          VERSION="${{ steps.version.outputs.display_version }}"
          RPM_VERSION=$(echo "$VERSION" | sed -E 's/^([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          RPM_RELEASE_SUFFIX=$(echo "$VERSION" | sed "s/^${RPM_VERSION}-\\?//;s/-/_/g")
          if [ -z "$RPM_RELEASE_SUFFIX" ]; then
            RPM_RELEASE="1"
          else
            RPM_RELEASE="1_${RPM_RELEASE_SUFFIX}"
          fi

          mkdir -p ~/rpmbuild/{SPECS,SOURCES,BUILD,RPMS,SRPMS}
          cp build/hostd ~/rpmbuild/SOURCES/

          cat > ~/rpmbuild/SPECS/network-speaker-hostd.spec << SPECEOF
          Name:       network-speaker-hostd
          Version:    ${RPM_VERSION}
          Release:    ${RPM_RELEASE}%{?dist}
          Summary:    Network Speaker host daemon - stream desktop audio over LAN
          License:    Proprietary
          URL:        https://github.com/yexuanyang/network_speaker

          %description
          Captures desktop audio via PulseAudio and streams it over LAN UDP to
          remote devices acting as network speakers.

          %install
          install -Dm755 %{_sourcedir}/hostd %{buildroot}%{_bindir}/hostd

          %files
          %{_bindir}/hostd
          SPECEOF

          rpmbuild -bb ~/rpmbuild/SPECS/network-speaker-hostd.spec

          RPM_FILE=$(find ~/rpmbuild/RPMS -name '*.rpm' | head -1)
          cp "$RPM_FILE" "NetworkSpeaker-${VERSION}-linux-x86_64.rpm"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-rpm
          path: NetworkSpeaker-*-linux-x86_64.rpm

      - name: Attach to release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: NetworkSpeaker-*-linux-x86_64.rpm
