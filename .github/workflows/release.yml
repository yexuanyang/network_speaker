name: release

on:
  push:
    tags:
      - "v*"
    branches:
      - staging
  workflow_dispatch:
    inputs:
      version:
        description: "Display version used for dry-run packaging"
        required: false
        default: "0.1.0-dev"

permissions:
  contents: write

jobs:
  resolve-release:
    runs-on: ubuntu-latest
    outputs:
      display_version: ${{ steps.meta.outputs.display_version }}
      numeric_version: ${{ steps.meta.outputs.numeric_version }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
      should_release: ${{ steps.meta.outputs.should_release }}
    steps:
      - name: Resolve release metadata
        id: meta
        run: |
          EVENT="${{ github.event_name }}"
          REF="${{ github.ref_name }}"
          SHA="${{ github.sha }}"
          SHORT_SHA="${SHA:0:7}"

          if [ "$EVENT" = "push" ]; then
            if [[ "$REF" == v* ]]; then
              # Tag push: stable release
              DISPLAY_VERSION="${REF#v}"
              RELEASE_TAG="$REF"
              IS_PRERELEASE="false"
              SHOULD_RELEASE="true"
            elif [ "$REF" = "staging" ]; then
              # Staging branch push: pre-release
              DISPLAY_VERSION="0.3.0-staging.${SHORT_SHA}"
              RELEASE_TAG="staging-latest"
              IS_PRERELEASE="true"
              SHOULD_RELEASE="true"
            fi
          else
            # workflow_dispatch: dry-run, no release
            DISPLAY_VERSION="${{ inputs.version }}"
            RELEASE_TAG=""
            IS_PRERELEASE="false"
            SHOULD_RELEASE="false"
          fi

          if [ -z "$DISPLAY_VERSION" ]; then
            echo "::error::Display version is required"
            exit 1
          fi

          NUMERIC_VERSION=$(echo "$DISPLAY_VERSION" | grep -oP '^\d+\.\d+\.\d+')
          if [ -z "$NUMERIC_VERSION" ]; then
            echo "::error::Display version must start with x.y.z"
            exit 1
          fi

          echo "display_version=$DISPLAY_VERSION" >> "$GITHUB_OUTPUT"
          echo "numeric_version=$NUMERIC_VERSION" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "should_release=$SHOULD_RELEASE" >> "$GITHUB_OUTPUT"

  build-windows-release:
    needs: [resolve-release]
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Initialize MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Run launcher core tests
        shell: pwsh
        run: |
          dotnet test .\apps\windows-launcher\NetworkSpeaker.Launcher.Core.Tests\NetworkSpeaker.Launcher.Core.Tests.csproj --configuration Release

      - name: Package Windows installer
        shell: pwsh
        run: |
          $version = "${{ needs.resolve-release.outputs.display_version }}"
          $packageBaseName = "NetworkSpeaker-$version-win-x64"
          .\tools\package-windows-installer.ps1 `
            -Version "$version" `
            -PackageBaseName "$packageBaseName"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            artifacts/release/*.msi
            artifacts/release/*.sha256.txt

      - name: Attach to release
        if: needs.resolve-release.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-release.outputs.release_tag }}
          name: ${{ needs.resolve-release.outputs.release_tag }}
          prerelease: ${{ needs.resolve-release.outputs.is_prerelease == 'true' }}
          make_latest: ${{ needs.resolve-release.outputs.is_prerelease != 'true' }}
          files: |
            artifacts/release/*.msi
            artifacts/release/*.sha256.txt

  build-android-release:
    needs: [resolve-release]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: |
          sdkmanager --install "ndk;27.1.12297006" "cmake;3.22.1"

      - name: Grant execute permission for gradlew
        working-directory: client/android-app
        run: chmod +x gradlew

      - name: Build release APK
        working-directory: client/android-app
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Find APK
        id: find_apk
        run: |
          APK_PATH=$(find . -name "*.apk" -path "*/release/*" | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "No APK found!"
            find . -name "*.apk" 2>/dev/null || echo "No APK files found"
            exit 1
          fi
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "Found APK at: $APK_PATH"

      - name: Rename APK with version
        run: |
          VERSION="${{ needs.resolve-release.outputs.display_version }}"
          cp "${{ steps.find_apk.outputs.apk_path }}" \
             "NetworkSpeaker-${VERSION}-android-arm64.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: NetworkSpeaker-*-android-arm64.apk

      - name: Attach to release
        if: needs.resolve-release.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-release.outputs.release_tag }}
          name: ${{ needs.resolve-release.outputs.release_tag }}
          prerelease: ${{ needs.resolve-release.outputs.is_prerelease == 'true' }}
          make_latest: ${{ needs.resolve-release.outputs.is_prerelease != 'true' }}
          files: NetworkSpeaker-*-android-arm64.apk

  build-linux-hostd:
    needs: [resolve-release]
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            label: ubuntu2204
          - os: ubuntu-24.04
            label: ubuntu2404
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build pkg-config \
            libopus-dev libpulse-dev libgtest-dev

      - name: Install modern CMake
        run: |
          pip install cmake 2>/dev/null || PIP_BREAK_SYSTEM_PACKAGES=1 pip install cmake
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package
        run: |
          VERSION="${{ needs.resolve-release.outputs.display_version }}"
          ARCHIVE_DIR="NetworkSpeaker-${VERSION}-linux-amd64-${{ matrix.label }}"
          mkdir "$ARCHIVE_DIR"
          cp build/hostd "$ARCHIVE_DIR/"
          tar -czf "${ARCHIVE_DIR}.tar.gz" "$ARCHIVE_DIR"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-hostd-${{ matrix.label }}
          path: NetworkSpeaker-*-linux-amd64-${{ matrix.label }}.tar.gz

      - name: Attach to release
        if: needs.resolve-release.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-release.outputs.release_tag }}
          name: ${{ needs.resolve-release.outputs.release_tag }}
          prerelease: ${{ needs.resolve-release.outputs.is_prerelease == 'true' }}
          make_latest: ${{ needs.resolve-release.outputs.is_prerelease != 'true' }}
          files: NetworkSpeaker-*-linux-amd64-${{ matrix.label }}.tar.gz

  build-desktop-linux:
    needs: [resolve-release]
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build pkg-config \
            libopus-dev libpulse-dev libgtest-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install modern CMake
        run: |
          pip install cmake 2>/dev/null || PIP_BREAK_SYSTEM_PACKAGES=1 pip install cmake
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Build hostd
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build build --target hostd

      - name: Stage hostd sidecar
        run: cp build/hostd apps/desktop/src-tauri/binaries/hostd-x86_64-unknown-linux-gnu

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build Tauri app
        working-directory: apps/desktop
        env:
          NO_STRIP: "true"
        run: npx tauri build

      - name: Package desktop app
        run: |
          VERSION="${{ needs.resolve-release.outputs.display_version }}"
          ARCHIVE_DIR="NetworkSpeaker-Desktop-${VERSION}-linux-amd64"
          mkdir "$ARCHIVE_DIR"
          # Copy Tauri bundle outputs
          cp apps/desktop/src-tauri/target/release/network-speaker-desktop "$ARCHIVE_DIR/"
          cp build/hostd "$ARCHIVE_DIR/"
          # Include deb if built
          find apps/desktop/src-tauri/target/release/bundle/deb -name '*.deb' -exec cp {} . \; 2>/dev/null || true
          find apps/desktop/src-tauri/target/release/bundle/appimage -name '*.AppImage' -exec cp {} . \; 2>/dev/null || true
          tar -czf "${ARCHIVE_DIR}.tar.gz" "$ARCHIVE_DIR"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: |
            NetworkSpeaker-Desktop-*-linux-amd64.tar.gz
            *.deb
            *.AppImage

      - name: Attach to release
        if: needs.resolve-release.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-release.outputs.release_tag }}
          name: ${{ needs.resolve-release.outputs.release_tag }}
          prerelease: ${{ needs.resolve-release.outputs.is_prerelease == 'true' }}
          make_latest: ${{ needs.resolve-release.outputs.is_prerelease != 'true' }}
          files: |
            NetworkSpeaker-Desktop-*-linux-amd64.tar.gz
            *.deb
            *.AppImage

  build-desktop-windows:
    needs: [resolve-release]
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install modern CMake
        run: pip install cmake

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Build hostd
        shell: pwsh
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build build --target hostd

      - name: Stage hostd sidecar
        shell: pwsh
        run: |
          Copy-Item "build\hostd.exe" "apps\desktop\src-tauri\binaries\hostd-x86_64-pc-windows-msvc.exe" -Force

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build Tauri app
        working-directory: apps/desktop
        run: npx tauri build

      - name: Package desktop app
        shell: pwsh
        run: |
          $version = "${{ needs.resolve-release.outputs.display_version }}"
          $archiveDir = "NetworkSpeaker-Desktop-$version-win-x64"
          New-Item -ItemType Directory -Force -Path $archiveDir | Out-Null
          Copy-Item "apps\desktop\src-tauri\target\release\network-speaker-desktop.exe" "$archiveDir\"
          Copy-Item "build\hostd.exe" "$archiveDir\"
          # Include MSI installer if built by Tauri
          if (Test-Path "apps\desktop\src-tauri\target\release\bundle\msi") {
            Get-ChildItem -Recurse -Path "apps\desktop\src-tauri\target\release\bundle\msi" -Filter "*.msi" |
              Copy-Item -Destination .
          }
          if (Test-Path "apps\desktop\src-tauri\target\release\bundle\nsis") {
            Get-ChildItem -Recurse -Path "apps\desktop\src-tauri\target\release\bundle\nsis" -Filter "*.exe" |
              Copy-Item -Destination .
          }
          Compress-Archive -Path "$archiveDir\*" -DestinationPath "$archiveDir.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: |
            NetworkSpeaker-Desktop-*-win-x64.zip
            *.msi
            *.exe

      - name: Attach to release
        if: needs.resolve-release.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-release.outputs.release_tag }}
          name: ${{ needs.resolve-release.outputs.release_tag }}
          prerelease: ${{ needs.resolve-release.outputs.is_prerelease == 'true' }}
          make_latest: ${{ needs.resolve-release.outputs.is_prerelease != 'true' }}
          files: |
            NetworkSpeaker-Desktop-*-win-x64.zip
            *.msi

  build-linux-rpm:
    needs: [resolve-release]
    runs-on: ubuntu-latest
    container: fedora:latest

    steps:
      - name: Install system dependencies
        run: |
          dnf install -y git gcc-c++ ninja-build pkgconf \
            opus-devel pulseaudio-libs-devel gtest-devel \
            python3-pip rpm-build

      - name: Install modern CMake
        run: PIP_BREAK_SYSTEM_PACKAGES=1 pip install cmake

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Build RPM
        run: |
          VERSION="${{ needs.resolve-release.outputs.display_version }}"
          RPM_VERSION=$(echo "$VERSION" | sed -E 's/^([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          RPM_RELEASE_SUFFIX=$(echo "$VERSION" | sed "s/^${RPM_VERSION}-\\?//;s/-/_/g")
          if [ -z "$RPM_RELEASE_SUFFIX" ]; then
            RPM_RELEASE="1"
          else
            RPM_RELEASE="1_${RPM_RELEASE_SUFFIX}"
          fi

          mkdir -p ~/rpmbuild/{SPECS,SOURCES,BUILD,RPMS,SRPMS}
          cp build/hostd ~/rpmbuild/SOURCES/

          cat > ~/rpmbuild/SPECS/network-speaker-hostd.spec << SPECEOF
          Name:       network-speaker-hostd
          Version:    ${RPM_VERSION}
          Release:    ${RPM_RELEASE}%{?dist}
          Summary:    Network Speaker host daemon - stream desktop audio over LAN
          License:    Proprietary
          URL:        https://github.com/yexuanyang/network_speaker

          %description
          Captures desktop audio via PulseAudio and streams it over LAN UDP to
          remote devices acting as network speakers.

          %install
          install -Dm755 %{_sourcedir}/hostd %{buildroot}%{_bindir}/hostd

          %files
          %{_bindir}/hostd
          SPECEOF

          rpmbuild -bb ~/rpmbuild/SPECS/network-speaker-hostd.spec

          RPM_FILE=$(find ~/rpmbuild/RPMS -name '*.rpm' | head -1)
          cp "$RPM_FILE" "NetworkSpeaker-${VERSION}-linux-x86_64.rpm"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-rpm
          path: NetworkSpeaker-*-linux-x86_64.rpm

      - name: Attach to release
        if: needs.resolve-release.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-release.outputs.release_tag }}
          name: ${{ needs.resolve-release.outputs.release_tag }}
          prerelease: ${{ needs.resolve-release.outputs.is_prerelease == 'true' }}
          make_latest: ${{ needs.resolve-release.outputs.is_prerelease != 'true' }}
          files: NetworkSpeaker-*-linux-x86_64.rpm

  generate-release-notes:
    needs: [resolve-release, build-windows-release, build-android-release, build-linux-hostd, build-desktop-linux, build-desktop-windows, build-linux-rpm]
    if: needs.resolve-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate and update release notes
        run: |
          VERSION="${{ needs.resolve-release.outputs.display_version }}"
          TAG="${{ needs.resolve-release.outputs.release_tag }}"
          IS_PRE="${{ needs.resolve-release.outputs.is_prerelease }}"
          PACKAGE_BASENAME="NetworkSpeaker-${VERSION}-win-x64"

          TEMPLATE=$(cat .github/release-notes-template.md)
          NOTES="${TEMPLATE//\{\{VERSION\}\}/$VERSION}"
          NOTES="${NOTES//\{\{PACKAGE_BASENAME\}\}/$PACKAGE_BASENAME}"

          if [ "$IS_PRE" = "true" ]; then
            HEADER="## Pre-release: ${VERSION}\n\n> **Warning**: This is an unstable pre-release from the \`staging\` branch. Use for testing only.\n\n"
            NOTES="${HEADER}${NOTES}"
          fi

          echo "$NOTES" > release-notes.md

      - name: Update release body
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-release.outputs.release_tag }}
          name: ${{ needs.resolve-release.outputs.release_tag }}
          body_path: release-notes.md
          prerelease: ${{ needs.resolve-release.outputs.is_prerelease == 'true' }}
          make_latest: ${{ needs.resolve-release.outputs.is_prerelease != 'true' }}
